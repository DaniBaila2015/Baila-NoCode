<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Baila NoCode — Construtor Visual para GitHub</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-layout">
    <!-- Barra Lateral de Edição -->
    <aside class="sidebar">
      <div class="brand">💃 Baila NoCode</div>
      <p class="tagline">Desenha visualmente. Publica código real.</p>

      <!-- Secção de Login OAuth Oficial -->
      <div class="auth-box" id="authBox">
        <button onclick="iniciarLoginGitHub()" class="btn-github" id="loginBtn">
          🐙 Entrar com GitHub
        </button>
        <div id="deviceCodeArea" class="device-code hidden">
          <p>1. Copia este código:</p>
          <strong id="userCode">----</strong>
          <p>2. Autoriza o <b>Baila NoCode</b> no GitHub:</p>
          <a id="verifyLink" href="#" target="_blank" class="btn-link">Autorizar Baila NoCode ↗</a>
        </div>
        <div id="userLogged" class="logged-info hidden">
          ✅ Conectado como <strong id="ghUsername"></strong>
        </div>
      </div>

      <!-- Blocos No-Code -->
      <div class="controls">
        <h3>Adicionar Blocos</h3>
        <div class="block-buttons">
          <button onclick="adicionarBloco('titulo')">+ Título</button>
          <button onclick="adicionarBloco('texto')">+ Texto</button>
          <button onclick="adicionarBloco('botao')">+ Botão</button>
          <button onclick="adicionarBloco('imagem')">+ Imagem</button>
        </div>

        <h3>Estilo da Página</h3>
        <label>Cor de Fundo:</label>
        <input type="color" id="bgColor" value="#0f172a" onchange="atualizarPreview()">
        
        <label>Cor do Cartão:</label>
        <input type="color" id="cardColor" value="#1e293b" onchange="atualizarPreview()">

        <label>Cor de Destaque (Botões):</label>
        <input type="color" id="accentColor" value="#ec4899" onchange="atualizarPreview()">

        <h3>Publicar no GitHub</h3>
        <input type="text" id="repoName" placeholder="ex: meu-site-baila">
        <button onclick="publicarProjeto()" class="btn-publish">🚀 Gerar Código e Publicar</button>
        <div id="statusMsg" class="status-msg"></div>
      </div>
    </aside>

    <!-- Área Central de Pré-visualização (Estilo Carrd) -->
    <main class="canvas-area">
      <div class="preview-frame" id="previewFrame">
        <div class="carrd-container" id="carrdContainer">
          <!-- Blocos editáveis aparecem aqui -->
        </div>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
